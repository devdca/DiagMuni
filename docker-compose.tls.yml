networks:
  # Red dedicada y con subred fija SOLO para que nginx pueda distinguir "esto
  # viene de Caddy" de "esto viene de cualquier otro proceso local" -- ver la
  # nota larga en nginx.conf sobre por qué confiar en todo 172.16.0.0/12 era un
  # error real (hallazgo de auditoría PentAGI, 19-ago-2026): en Docker Desktop,
  # cualquier contenedor de CUALQUIER proyecto que llegue a nginx via el puerto
  # publicado en el host (ej. `host.docker.internal`, o incluso `curl` corrido
  # a mano en el propio Windows) aparece ante nginx como la IP del gateway de
  # `diagmuni_default` (172.18.0.1 en este equipo) -- una IP dentro de ese
  # rango, así que la regla anterior confiaba en el X-Forwarded-For de
  # cualquiera, no solo de Caddy. Fijar la IP exacta de Caddy en una red
  # aparte, que nadie más comparte, cierra ese hueco sin ambigüedad.
  caddy-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  # Termina TLS delante de nginx (docs/runbook-despliegue.md, "HTTPS/TLS").
  # Caddy y no certbot: obtiene y renueva certificados Let's Encrypt solo, sin
  # exigir un volumen de certs ni un companion con acceso al socket de Docker
  # para renovar -- nginx/Dockerfile no necesita ningún cambio.
  caddy:
    image: caddy:2-alpine
    # Solo las dos variables que el Caddyfile usa -- no env_file: .env, para que
    # un contenedor de borde público (el único con puertos 80/443 abiertos a
    # internet) no cargue de paso JWT_SECRET, las API keys de la Capa IA ni las
    # credenciales de Postgres, que no necesita para nada.
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - diagmuni_caddy_data:/data
      - diagmuni_caddy_config:/config
    depends_on:
      nginx:
        condition: service_started
    # IP fija -- es exactamente el valor que nginx.conf declara en
    # set_real_ip_from. Sin esto, Caddy tomaría una IP dinámica de
    # caddy-edge y la confianza de nginx quedaría apuntando a nada.
    networks:
      caddy-edge:
        ipv4_address: 172.28.0.10

  # !override (no la fusión por default, que concatenaría listas) -- con Caddy
  # delante, el 8090 público deja de ser necesario y confiar en el
  # X-Forwarded-For que agrega nginx.conf exige que nadie más pueda llegar
  # directo a nginx desde fuera. Se deja en loopback, no se cierra del todo,
  # para que `curl http://127.0.0.1:8090/health` siga sirviendo desde el propio
  # servidor.
  nginx:
    ports: !override
      - "127.0.0.1:8090:80"
    # Se agrega caddy-edge SIN quitar la red default (nginx sigue necesitando
    # llegar a `backend`) -- explícito para no depender de que Compose decida
    # solo si conservar la red implícita al agregar una lista de networks.
    networks:
      - default
      - caddy-edge

volumes:
  diagmuni_caddy_data:
  diagmuni_caddy_config:
