    nota_infraestructura: "pgcrypto es una extensión de PostgreSQL (contrib/pgcrypto), no un servicio independiente: se habilita con CREATE EXTENSION pgcrypto dentro del mismo motor PostgreSQL que el sistema de trámites de la intendencia/municipio ya necesita para operar. No agrega cómputo, memoria ni un servicio nuevo que hostear."
    costo_implementacion_mxn: "[NO VERIFICADO]"
    costo_implementacion_uyu: "[NO VERIFICADO]"
    costo_implementacion_usd: "[NO VERIFICADO]"
    nota_implementacion: "Habilitar la extensión es una sola sentencia SQL; el costo real está en adaptar el código de la aplicación de trámites para cifrar/descifrar campos de datos personales y en capacitar al personal. No se encontró una fuente pública citable de horas típicas para ese trabajo de adaptación aplicado a un sistema de trámites municipal — no se fabrica la cifra."
    fuente_costo: "https://raw.githubusercontent.com/postgres/postgres/master/contrib/pgcrypto/pgcrypto.c (licencia); https://www.postgresql.org/docs/current/pgcrypto.html (mecanismo de habilitación, sin infraestructura adicional)"
