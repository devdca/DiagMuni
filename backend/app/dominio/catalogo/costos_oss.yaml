# F5 — Catálogo de costos paramétricos por componente OSS (docs/PRD.md líneas 53-54)
# Una entrada por cada valor único de categoria_catalogo, alineada 1:1 con las claves
# de backend/app/engine/catalogo/componentes_oss.yaml. Metodología completa, fuentes
# consultadas y huecos declarados en entregables/fase-2/catalogo-costos-oss.md.
version: "1.0"

tipo_cambio:
  mxn_por_usd: "17.3562"
  fuente_mxn_por_usd: "Banco de México, tipo de cambio FIX (serie SF63528), valor determinado el 2026-07-30 — https://www.banxico.org.mx/SieInternet/consultarDirectorioInternetAction.do?sector=6&accion=consultarCuadro&idCuadro=CF373&locale=es. Es el valor aplicable a obligaciones denominadas en USD pagaderas el 2026-08-03: conforme a las Disposiciones aplicables a la determinación del tipo de cambio para solventar obligaciones denominadas en moneda extranjera pagaderas en la República Mexicana (Banco de México, Circular 3/2012, Título Tercero, Capítulo V), el FIX determinado un día hábil bancario se publica en el DOF un día hábil después y es aplicable el día hábil siguiente a esa publicación — es decir, el segundo día hábil bancario tras su determinación (jueves 30-jul-2026 + 2 días hábiles, saltando el fin de semana, = lunes 03-ago-2026)."
  uyu_por_usd: "40.0979"
  fuente_uyu_por_usd: "Wise, histórico de cotización de mercado USD/UYU para 2026-08-03 — https://wise.com/us/currency-converter/usd-to-uyu-rate/history. No es la cotización oficial del Banco Central del Uruguay/BROU: al momento de la consulta esas fuentes oficiales no habían publicado todavía el dato de esta fecha específica (ver detalle en el documento de evidencia)."
  fecha_consulta: "2026-08-03"

