# Fase A -- piloto estatal (LNETB, no LGMR -- ver nota en
# autoridad_gobernanza_digital.yaml de esta misma carpeta). Verificado leyendo
# el texto oficial completo: este artículo específicamente SÍ cambió de
# numeración respecto a la ley abrogada (antes art. 8-VIII, ahora art. 6-VIII
# en la LNETB vigente). Solo México, sin rama `uy`.
version: "1.0"
variable: firma_electronica_habilitada
criterio_deteccion: "firma_electronica_habilitada == false"
acciones:
  mx:
    paso_administrativo: "Habilitar la firma electrónica avanzada para este trámite, conforme al principio de equivalencia funcional de la LNETB"
    paso_tecnico: "Integrar verificación de firma con estándar abierto (PAdES/XAdES)"
    paso_organizacional: "Capacitar a funcionarios de mostrador en uso del certificado y verificación de firmas"
    prerrequisitos: ["Conectividad estable"]
    por_que_importa: "La LNETB establece que los documentos digitales con firma electrónica avanzada emitidos por autoridades estatales tienen el mismo valor que los documentos impresos con firma autógrafa -- sin esto, el trámite no puede prescindir del papel con certeza jurídica"
    fuente_normativa: "LNETB art. 6, fracc. VIII (equivalencia funcional) -- marco general, aplicable a las 32 entidades por igual"
    categoria_catalogo: "modulo_firma_electronica"
