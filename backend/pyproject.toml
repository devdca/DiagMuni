[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

# Adopción incremental de tipado estricto: core/ (transversal) y dominio/
# (motor determinista puro, sin HTTP/DB) primero, por ser los paquetes de
# menor riesgo. aplicacion/ y adaptadores/ quedan para una siguiente
# iteración, una vez que estos dos estén limpios.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.dominio.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Medido en vivo el 2026-09-10 (localhost, sin Postgres alcanzable -- todos los
# tests marcados postgres se saltan): 76% total. En CI (con Postgres real como
# servicio, ver .github/workflows/ci.yml) esos tests sí corren, y la cifra real
# ahí sube a 89% -- 70% deja margen sin ser un número inventado.
# Fase 1 del plan de producción integrada, DoD "cobertura medida y >=70%".
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
