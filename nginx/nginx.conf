server {
    listen 80;

    # Con Caddy delante (docker-compose.tls.yml), $remote_addr deja de ser la IP
    # real del cliente -- pasa a ser la IP interna de Caddy. Confiar en
    # X-Forwarded-For es obligatorio para que el rate limiting de
    # backend/app/core/rate_limit.py (hallazgo Strix vuln-0001) no colapse todas
    # las peticiones en un solo bucket cuando SÍ hay un proxy adicional delante.
    #
    # CORREGIDO 19-ago-2026 (hallazgo real de una auditoría con PentAGI): la
    # versión anterior confiaba en todo 172.16.0.0/12, razonando que "un
    # atacante externo nunca conecta desde ese rango" -- falso en Docker
    # Desktop (y en general para cualquier tráfico que entre por hairpin NAT
    # de un puerto publicado): un contenedor de OTRO proyecto de Compose,
    # completamente ajeno, llegó a este nginx via `host.docker.internal` y
    # apareció como 172.18.0.1 -- el gateway de la propia red
    # `diagmuni_default` -- que cae dentro de ese rango. Con la regla vieja,
    # cualquier proceso local podía forjar X-Real-IP vía X-Forwarded-For y
    # evadir el rate limiter (confirmado en vivo: rotar X-Forwarded-For daba
    # 12/12 intentos de login sin bloqueo). Ahora se confía únicamente en la
    # IP fija de Caddy (docker-compose.tls.yml, red `caddy-edge` dedicada,
    # `ipv4_address: 172.28.0.10`) -- ninguna otra IP, ni siquiera dentro de
    # `diagmuni_default`, puede presentarse con esa dirección exacta.
    # Depende de que nginx.ports esté en loopback cuando docker-compose.tls.yml
    # está activo (ver ese archivo) -- de lo contrario un atacante que llegue
    # directo por el puerto público podría forjar este header.
    set_real_ip_from 172.28.0.10;
    real_ip_header X-Forwarded-For;

    # Cabeceras de seguridad (hallazgo de Strix, vuln-0002, "Missing security
    # response headers"). Se fijan aquí y no en FastAPI porque nginx es el único
    # borde publicado (docker-compose.yml: el servicio backend solo usa `expose`,
    # nunca `ports`) y sirve tanto los archivos estáticos del frontend como el
    # proxy de /api/ -- un solo punto cubre ambos sin duplicar la lógica de
    # cabeceras en dos capas. `always` para que también viajen en respuestas de
    # error (4xx/5xx), no solo en 200.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    # Inerte hasta que este borde (u otro por delante) termine TLS -- los
    # navegadores ignoran HSTS sobre HTTP plano por diseño (RFC 6797). Queda
    # declarado desde ahora para no depender de acordarse de agregarlo al activar
    # HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
