server {
    listen 80;

    # Cabeceras de seguridad (hallazgo de Strix, vuln-0002, "Missing security
    # response headers"). Se fijan aquí y no en FastAPI porque nginx es el único
    # borde publicado (docker-compose.yml: el servicio backend solo usa `expose`,
    # nunca `ports`) y sirve tanto los archivos estáticos del frontend como el
    # proxy de /api/ -- un solo punto cubre ambos sin duplicar la lógica de
    # cabeceras en dos capas. `always` para que también viajen en respuestas de
    # error (4xx/5xx), no solo en 200.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    # Inerte hasta que este borde (u otro por delante) termine TLS -- los
    # navegadores ignoran HSTS sobre HTTP plano por diseño (RFC 6797). Queda
    # declarado desde ahora para no depender de acordarse de agregarlo al activar
    # HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
