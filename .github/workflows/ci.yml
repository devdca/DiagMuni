name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Salvaguarda contra el incidente de 2026-08 (nota interna de sesión, no versionada):
  # nombres de agentes de desarrollo y rutas internas del proceso (coordinador, auditor,
  # especialista, etc. como roles de un equipo de desarrollo multi-agente) se filtraron en
  # docs/ y entregables/ como si fueran módulos o especificaciones del propio producto.
  # No es un deny-list de palabras genéricas -- "auditor"/"especialista"/"legislación" tienen
  # uso legítimo de dominio en este repo (ej. app/ia/verificador.py, docs/anexo_legislacion_*.md)
  # y una lista así rompería el build todo el tiempo. Solo chequea identificadores compuestos
  # que son inequívocamente del proceso interno -- los mismos que este .gitignore ya marca
  # como "Material interno" (líneas 1-9) -- para detectar una referencia por nombre/ruta a
  # esos artefactos colada en contenido que sí se publica.
  higiene-repo-publico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chequeo de fuga de proceso interno de desarrollo
        run: |
          PATRON='sistema-multiagente|docs/plan-trabajo|CLAUDE\.md|\.claude/|/Contexto/|/Local/'
          if git grep -InE "$PATRON" -- . ':!.github/workflows/ci.yml' ':!.gitignore'; then
            echo "::error::Referencia a un artefacto interno de desarrollo en contenido público -- revisar antes de mergear."
            exit 1
          fi
          echo "Sin referencias a artefactos internos de desarrollo en contenido versionado."

  backend:
    needs: [higiene-repo-publico]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt
      # 1. lint
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      # 2. type-check
      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app
      # 3. tests
      - name: Tests (pytest)
        working-directory: backend
        run: pytest
      # 4. chequeo de licencias (docs/TRD.md; Principio 2 de docs/stack-tecnologico.md).
      # Deny-list, no allow-list: muchos paquetes MIT/BSD/Apache reales (anyio, click,
      # idna, packaging...) no traen un clasificador de licencia limpio en su metadata
      # y pip-licenses los reporta como "UNKNOWN" — un allow-only estricto fallaría el
      # build por eso, no por un riesgo real. El gate duro es AGPL/GPL (contaminación
      # de licencia real); "UNKNOWN" se imprime para revisión humana, no bloquea.
      - name: "Chequeo de licencias de dependencias (gate duro: GPL/AGPL)"
        working-directory: backend
        run: |
          pip-licenses --fail-on="GNU General Public License (GPL);GNU General Public License v2 (GPLv2);GNU General Public License v2 or later (GPLv2+);GNU General Public License v3 (GPLv3);GNU General Public License v3 or later (GPLv3+);GNU Affero General Public License v3 (AGPLv3);GNU Affero General Public License v3 or later (AGPLv3+)"
      - name: Licencias sin clasificar (revisión humana, no bloquea el build)
        working-directory: backend
        run: pip-licenses | grep -i unknown || echo "Ninguna licencia sin clasificar."

  frontend:
    needs: [higiene-repo-publico]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install
      # 1. lint (eslint flat config, ver frontend/eslint.config.js) -- src/ con reglas
      # type-aware (mismo rigor que mypy en el backend); e2e/ solo con las reglas base
      # de TS, sin las de React (no hay componentes ahí).
      - name: Lint (eslint)
        working-directory: frontend
        run: npx eslint .
      # 2. type-check. Los tests (E2E) están en el job `e2e` de abajo: necesitan Docker
      # (stack completo), no tienen sentido en este job liviano de solo Node.
      - name: Type-check (tsc)
        working-directory: frontend
        run: npx tsc -b
      # 4. chequeo de licencias de dependencias (docs/stack-tecnologico.md, Principio 2).
      # Deny-list, no allow-list: mismo criterio que el paso 4 del job backend (líneas 31-36) —
      # el gate duro es GPL/AGPL (contaminación de licencia real); licencias permisivas no
      # listadas de forma explícita (ISC, MPL-2.0, CC-BY-4.0, etc.) no bloquean el build.
      # Para simular este paso en local: `cd frontend && npm install && npx license-checker-rseidelsohn --excludePrivatePackages --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;GPL-1.0;GPL-2.0;GPL-3.0;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;AGPL-1.0;AGPL-3.0"`
      - name: "Chequeo de licencias de dependencias (gate duro: GPL/AGPL)"
        working-directory: frontend
        run: |
          npx license-checker-rseidelsohn --excludePrivatePackages --failOn "GPL-1.0-only;GPL-1.0-or-later;GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;GPL-1.0;GPL-2.0;GPL-3.0;AGPL-1.0-only;AGPL-1.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;AGPL-1.0;AGPL-3.0"

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 3. tests (E2E, frontend) — recorre las 6 pantallas de docs/app-flow.md contra el
      # stack Docker real (docs/runbook-despliegue.md), no contra `vite dev` ni mocks.
      - name: Configurar .env
        run: cp .env.example .env
      - name: Levantar el stack
        run: docker compose up -d --build
      - name: Esperar a que la plataforma responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/health && exit 0
            sleep 2
          done
          echo "La plataforma no respondió a tiempo." >&2
          docker compose logs
          exit 1
      - name: Correr migraciones
        run: docker compose exec -T backend alembic upgrade head
      # Gobierno de prueba exclusivo de este run — bootstrap_tenant.py genera la
      # contraseña al vuelo y a propósito nunca acepta una fija (docs/plan-implementacion-
      # alta-gobierno.md, sección 2 y 5); se parsea de su salida en vez de hardcodearla.
      - name: Crear gobierno de prueba y capturar credenciales
        run: |
          SALIDA=$(docker compose exec -T backend python -m app.bootstrap_tenant crear-gobierno \
            --nombre "Gobierno E2E CI" --clave e2e-ci --pais mx \
            --email e2e-ci@diagmuni.test --nombre-funcionario "CI Bot")
          echo "$SALIDA"
          PASSWORD=$(echo "$SALIDA" | grep "Contraseña de arranque:" | sed 's/^.*Contraseña de arranque: //')
          if [ -z "$PASSWORD" ]; then
            echo "No se pudo capturar la contraseña generada." >&2
            exit 1
          fi
          echo "E2E_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm install
      - name: Instalar navegador de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Tests E2E (Playwright)
        working-directory: frontend
        env:
          E2E_CLAVE_GOBIERNO: e2e-ci
          E2E_EMAIL: e2e-ci@diagmuni.test
        run: npx playwright test
      - name: Subir reporte de Playwright (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Logs del backend (si falló)
        if: failure()
        run: docker compose logs backend
      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  build-images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. build de imágenes Docker
      - name: Build imagen backend
        run: docker build -f backend/Dockerfile -t diagmuni-backend:ci .
      - name: Build imagen nginx (incluye build de frontend)
        run: docker build -f nginx/Dockerfile -t diagmuni-nginx:ci .

  preview:
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      # 6. deploy de preview a Cloudflare Pages — solo en PRs, nunca en main (docs/stack-tecnologico.md).
      # Se salta limpio (no falla el build) mientras los secrets de Cloudflare no estén
      # configurados en el repo -- todavía no hay proyecto de Cloudflare Pages creado.
      - name: Deploy preview a Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: diagmuni
          directory: frontend/dist
