services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diagmuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagmuni}
      POSTGRES_DB: ${POSTGRES_DB:-diagmuni}
    volumes:
      - diagmuni_db_data:/var/lib/postgresql/data
      # Crea el rol de aplicación sin privilegios de superusuario — ver backend/db-init/01-app-role.sql.
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagmuni}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  diagmuni_db_data:
